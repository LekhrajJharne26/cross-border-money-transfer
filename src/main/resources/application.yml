spring:
  application:
    name: cross-border-money-transfer

  datasource:
    url: jdbc:mysql://localhost:3306/cross_border_db
    username: root
    password: Iamback@2
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
